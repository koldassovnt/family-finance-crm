# `docker compose up -d` starts only Postgres, for running the app from the
# IDE or `./gradlew bootRun`. `docker compose --profile app up -d --build`
# also builds and runs the application container against it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: family-finance-postgres
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: family_finance
      # Read only when the data volume is first created; changing it later
      # needs an ALTER USER inside the container.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Loopback only, so a DB viewer on this machine can connect but the
      # network cannot. The app reaches it over the compose network.
      - "${POSTGRES_PORT:-127.0.0.1:6432}:5432"
    volumes:
      - family-finance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_finance -d family_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    container_name: family-finance-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/family_finance
      DB_USERNAME: family_finance
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Required; the app refuses to start without at least 32 bytes.
      JWT_SECRET: ${JWT_SECRET:-}
      # Creates the OWNER on a start that finds none; ignored once one exists.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  family-finance-pgdata:
