# `docker compose up -d` starts only Postgres, for running the app from the
# IDE or `./gradlew bootRun`. `docker compose --profile app up -d --build`
# also builds and runs the application container against it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: family-finance-postgres
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: family_finance
      # Read only when the data volume is first created; changing it later
      # needs an ALTER USER inside the container.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Loopback only, so a DB viewer on this machine can connect but the
      # network cannot. The app reaches it over the compose network.
      - "${POSTGRES_PORT:-127.0.0.1:6432}:5432"
    volumes:
      - family-finance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_finance -d family_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    container_name: family-finance-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/family_finance
      DB_USERNAME: family_finance
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Required; the app refuses to start without at least 32 bytes.
      JWT_SECRET: ${JWT_SECRET:-}
      # Creates the OWNER on a start that finds none; ignored once one exists.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      # Optional: prices and exchange rates from API Ninjas. Unset = switched off.
      API_NINJAS_KEY: ${API_NINJAS_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  # Nightly pg_dump into BACKUP_DIR (a folder on another disk), 14 nightly +
  # 12 monthly kept. Same image as the database so pg_dump always matches the
  # server's major version. In the app profile so a dev stack never writes to
  # BACKUP_DIR. See db/backup.sh.
  backup:
    profiles: ["app"]
    image: postgres:17-alpine
    container_name: family-finance-backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup.sh"]
    command: ["schedule"]
    environment:
      TZ: Asia/Almaty
      PGHOST: postgres
      PGDATABASE: family_finance
      PGUSER: family_finance
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ${BACKUP_DIR:?set BACKUP_DIR in .env}:/backups
      - ./db/backup.sh:/scripts/backup.sh:ro
    healthcheck:
      # Unhealthy once the newest dump is over 26 hours old.
      test: ["CMD", "sh", "/scripts/backup.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      start_period: 2m
    restart: unless-stopped

# Pinned: the frontend's compose joins this network by name, so it must not
# follow the folder name or a `-p` override.
networks:
  default:
    name: family-finance-crm_default

volumes:
  family-finance-pgdata:
