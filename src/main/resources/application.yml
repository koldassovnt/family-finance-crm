spring:
  application:
    name: family-finance-crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/family_finance}
    username: ${DB_USERNAME:family_finance}
    password: ${DB_PASSWORD:family_finance}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: family-finance-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    openfeign:
      client:
        config:
          default:
            # A slow price API must not hold a refresh open indefinitely.
            connect-timeout: 5000
            read-timeout: 10000

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: Asia/Almaty
  jwt:
    secret: ${JWT_SECRET:}
    expiry-days: 30
  bootstrap-owner:
    email: ${OWNER_EMAIL:}
    display-name: ${OWNER_DISPLAY_NAME:}
    password: ${OWNER_PASSWORD:}
  # Prices and exchange rates from API Ninjas. Blank key = switched off.
  market-data:
    api-key: ${API_NINJAS_KEY:}
    base-url: https://api.api-ninjas.com
    daily-limit: 30
    refresh-cron: "0 0 8 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
