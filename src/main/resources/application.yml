spring:
  application:
    name: family-finance-crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_finance}
    username: ${DB_USERNAME:family_finance}
    password: ${DB_PASSWORD:family_finance}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: family-finance-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: Asia/Almaty
  jwt:
    secret: ${JWT_SECRET:}
    expiry-days: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
